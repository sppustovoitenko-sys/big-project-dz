<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Todo App</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

<header class="header">
<h1>✓ My Todo App</h1>
</header>

<main class="main">

<form class="input-section" action="/add" method="post">

<input
name="text"
class="todo-input"
placeholder="Добавить новую задачу..."
>

<button class="btn-add">Добавить</button>

</form>

<div class="filters">

<a href="/?filter=all" class="filter-btn">Все</a>
<a href="/?filter=active" class="filter-btn">Активные</a>
<a href="/?filter=completed" class="filter-btn">Завершённые</a>

</div>

<div class="stats">

<span>Всего: <strong>{{total}}</strong></span>
<span>Активные: <strong>{{active}}</strong></span>
<span>Завершённые: <strong>{{completed}}</strong></span>

</div>

<div class="todo-list">

{% if todos %}

{% for todo in todos %}

<div class="todo-item {% if todo.completed %}completed{% endif %}">

<form action="/toggle/{{todo.id}}" method="post">

<input
type="checkbox"
class="todo-checkbox"
onchange="this.form.submit()"
{% if todo.completed %}checked{% endif %}
>

</form>

<span class="todo-text">{{todo.text}}</span>

<div class="todo-actions">

<form action="/delete/{{todo.id}}" method="post">

<button class="btn-delete">✕</button>

</form>

</div>

</div>

{% endfor %}

{% else %}

<div class="empty-state">
<p>📝 Нет задач. Добавьте первую!</p>
</div>

{% endif %}

</div>

<form action="/clear" method="post">

<button class="btn-clear">
Очистить завершённые
</button>

</form>

</main>

<footer class="footer">
<p>Made with ❤️ | Efficient Task Management</p>
</footer>

</div>

</body>
</html>
