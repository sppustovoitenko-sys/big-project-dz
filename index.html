<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App - Управление задачами</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1>✓ My Todo App</h1>
                <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌙</button>
            </div>
        </header>

        <main class="main">
            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Добавить новую задачу..."
                    autocomplete="off"
                >
                <button class="btn-add" id="addBtn">Добавить</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="active">Активные</button>
                <button class="filter-btn" data-filter="completed">Завершённые</button>
            </div>

            <div class="stats">
                <span>Всего: <strong id="totalCount">0</strong></span>
                <span>Активные: <strong id="activeCount">0</strong></span>
                <span>Завершённые: <strong id="completedCount">0</strong></span>
            </div>

            <div id="todoList" class="todo-list">
                <!-- Задачи добавляются сюда -->
            </div>

            <div id="emptyState" class="empty-state">
                <p>📝 Нет задач. Добавьте первую!</p>
            </div>

            <button class="btn-clear" id="clearBtn" style="display: none;">
                Очистить завершённые
            </button>
        </main>

        <footer class="footer">
            <p>Made with ❤️ | Efficient Task Management</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
